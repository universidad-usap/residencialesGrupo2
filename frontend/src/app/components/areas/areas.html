<div class="page-container">
  
  <!-- Form Section -->
  <div class="form-section" [class.editing]="isEditing">
    <div class="form-section-title">
      <i class="fas" [ngClass]="isEditing ? 'fa-edit' : 'fa-plus-circle'"></i>
      {{ isEditing ? 'Editar Área Seleccionada' : 'Registrar Nueva Área' }}
      <span *ngIf="isEditing" class="badge bg-warning ms-2">Editando</span>
    </div>

    <div class="row g-3">
      <div class="col-12 col-md-5">
        <label class="form-label">Nombre del Área</label>
        <input type="text" [(ngModel)]="area.nombre" class="form-control"
               autocomplete="off" placeholder="Ej: Gimnasio">
      </div>
      <div class="col-12 col-md-5">
        <label class="form-label">Descripción / Observaciones</label>
        <input type="text" [(ngModel)]="area.descripcion" class="form-control"
               autocomplete="off" placeholder="Ej: Abierto de 6am a 10pm">
      </div>
      <div class="col-12 col-md-2 d-flex align-items-end gap-2">
        <button *ngIf="!isEditing" class="btn btn-primary w-100" (click)="guardarNuevaArea()">
          <i class="fas fa-save"></i> Guardar
        </button>
        <ng-container *ngIf="isEditing">
          <button class="btn btn-warning flex-grow-1" (click)="actualizarArea()">
            <i class="fas fa-sync-alt"></i> Actualizar
          </button>
          <button class="btn btn-secondary" (click)="cancelarEdicion()" title="Cancelar">
            <i class="fas fa-times"></i>
          </button>
        </ng-container>
      </div>
    </div>
  </div>

  <!-- Data Table -->
  <div class="data-table-card">
    <div class="data-table-header">
      <div class="data-table-title">
        <i class="fas fa-layer-group"></i> Gestión de Áreas
      </div>
      <span class="record-count">{{ listAreas.length }} Registros</span>
    </div>
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead>
          <tr>
            <th style="width: 70px">ID</th>
            <th>Nombre</th>
            <th>Descripción</th>
            <th class="text-center">Editar</th>
            <th class="text-center">Estado</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let a of listAreas" class="animate-fade-in">
            <td class="fw-bold text-muted">{{ a.id_area }}</td>
            <td [class.text-muted]="a.estado === 0">
              <span class="fw-semibold">{{ a.nombre }}</span>
            </td>
            <td [class.text-muted]="a.estado === 0">{{ a.descripcion }}</td>

            <td class="text-center">
              <button class="btn btn-outline-info btn-sm"
                      (click)="cargarArea(a)"
                      [disabled]="a.estado === 0"
                      title="Editar información">
                <i class="fas fa-edit"></i>
              </button>
            </td>

            <td class="text-center">
              <button *ngIf="a.estado === 1"
                      class="btn btn-outline-danger btn-sm"
                      (click)="eliminarArea(a.id_area)">
                <i class="fas fa-toggle-off"></i> Desactivar
              </button>
              <button *ngIf="a.estado === 0"
                      class="btn btn-outline-success btn-sm"
                      (click)="activarArea(a.id_area)">
                <i class="fas fa-toggle-on"></i> Activar
              </button>
            </td>
          </tr>

          <tr *ngIf="listAreas.length === 0">
            <td colspan="5" class="empty-state">
              <i class="fas fa-inbox"></i>
              <p>No se encontraron registros en la base de datos.</p>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
