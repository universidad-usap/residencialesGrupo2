<div [class.dark-mode]="isDarkMode" class="login-wrapper">
  <button class="theme-toggle" (click)="toggleTheme()" type="button">
    <i class="fas" [ngClass]="isDarkMode ? 'fa-sun' : 'fa-moon'"></i>
  </button>

  <div class="login-card-container">
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-wrapper">
          <img src="img/logo.png" width="80" alt="Logo Residenciales" />
        </div>
        <h1 class="login-brand">Valle del Angel</h1>
        <p class="login-subtitle">Sistema de Gestion Residencial</p>
      </div>

      <form (ngSubmit)="ejecutarLogin()" #authForm="ngForm" class="login-form">
        <div class="form-group">
          <label class="form-label">Usuario</label>
          <div class="input-wrapper">
            <i class="fas fa-at input-icon"></i>
            <input
              type="text"
              [(ngModel)]="loginData.usuario"
              name="loginU"
              class="form-control form-input"
              required
              placeholder="Tu usuario"
            />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Contrasena</label>
          <div class="input-wrapper">
            <i class="fas fa-lock input-icon"></i>
            <input
              [type]="showPassword ? 'text' : 'password'"
              [(ngModel)]="loginData.password"
              name="loginP"
              class="form-control form-input"
              required
              placeholder="........"
            />
            <button class="password-toggle" type="button" (click)="togglePassword()">
              <i class="fas" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-login-submit" [disabled]="!authForm.valid">
          Iniciar Sesion
          <i class="fas fa-arrow-right"></i>
        </button>
      </form>
    </div>
  </div>
</div>
