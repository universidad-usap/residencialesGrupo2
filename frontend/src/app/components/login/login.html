<div [class.dark-mode]="isDarkMode" class="main-wrapper vh-100 w-100 m-0 p-0">
  
  <button class="theme-toggle shadow" (click)="toggleTheme()" type="button" title="Cambiar Tema">
    <i class="fas" [ngClass]="isDarkMode ? 'fa-sun' : 'fa-moon'"></i>
  </button>

  <div class="container-fluid d-flex justify-content-center align-items-center h-100">
    <div class="card shadow-lg border-0 login-card">
      <div class="card-body p-5">
        
        <div class="text-center mb-4">
          <div class="brand-icon shadow">
            <i class="fas fa-shield-alt fa-2x"></i>
          </div>
          <h2 class="fw-bold mt-3">Residencial QR</h2>
          <p class="text-muted small">Panel de Gestión Administrativa</p>
        </div>

        <form (submit)="onLogin()">
          
          <div class="mb-3">
            <label class="form-label fw-bold small text-uppercase">Usuario</label>
            <div class="input-group custom-field shadow-sm">
              <span class="input-group-text"><i class="fas fa-user"></i></span>
              <input type="text" [(ngModel)]="loginData.usuario" name="usuario" class="form-control" placeholder="Ingresa tu usuario" required>
            </div>
          </div>

          <div class="mb-2">
            <label class="form-label fw-bold small text-uppercase">Contraseña</label>
            <div class="input-group custom-field shadow-sm">
              <span class="input-group-text"><i class="fas fa-lock"></i></span>
              <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="loginData.password" name="password" class="form-control" placeholder="********" required>
              <button class="btn btn-eye-toggle border-0" type="button" (click)="togglePassword()">
                <i class="fas" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
              </button>
            </div>
          </div>

          <div class="text-end mb-4">
            <a href="javascript:void(0)" (click)="olvidePassword()" class="text-decoration-none small fw-bold text-accent">¿Olvidaste tu contraseña?</a>
          </div>

          <button type="submit" class="btn btn-login w-100 py-3 fw-bold shadow mb-3 text-uppercase">
            INICIAR SESIÓN <i class="fas fa-sign-in-alt ms-2"></i>
          </button>

          <div class="text-center border-top pt-3 register-section">
            <p class="text-muted small mb-2">¿No tienes una cuenta?</p>
            <button type="button" (click)="mostrarRegistro()" class="btn btn-outline-secondary btn-sm px-4 rounded-pill">
              <i class="fas fa-user-plus me-1"></i> Crear Usuario Nuevo
            </button>
          </div>
        </form>

      </div>
    </div>
  </div>
</div>
