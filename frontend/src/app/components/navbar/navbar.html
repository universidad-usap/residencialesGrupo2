<aside *ngIf="showNavbar()" class="sidebar">

  <!-- Header -->
  <div class="sidebar-header">
    <div class="sidebar-brand">
      <div class="brand-icon">
        <i class="fas fa-building"></i>
      </div>
      <span class="brand-text">Valle del Ángel</span>
    </div>
    <button class="sidebar-toggle" (click)="toggleSidebar()" [title]="isCollapsed ? 'Expandir' : 'Colapsar'">
      <i class="fas" [ngClass]="isCollapsed ? 'fa-chevron-right' : 'fa-chevron-left'"></i>
    </button>
  </div>

  <!-- Navigation -->
  <nav class="sidebar-nav">

    <!-- Mantenimientos -->
    <div class="nav-section">
      <button class="section-header" (click)="toggleSection('mantenimientos')">
        <div class="section-header-left">
          <i class="fas fa-tools section-icon"></i>
          <span class="section-label">Mantenimientos</span>
        </div>
        <i class="fas fa-chevron-down section-arrow" [class.rotated]="!isSectionExpanded('mantenimientos')"></i>
      </button>
      <div class="section-links" [class.collapsed]="!isSectionExpanded('mantenimientos')">
        <a routerLink="/casas" routerLinkActive="active" class="nav-link">
          <i class="fas fa-home nav-link-icon"></i>
          <span class="nav-link-label">Casas</span>
        </a>
        <a routerLink="/residentes" routerLinkActive="active" class="nav-link">
          <i class="fas fa-users nav-link-icon"></i>
          <span class="nav-link-label">Residentes</span>
        </a>
        <a routerLink="/areas" routerLinkActive="active" class="nav-link">
          <i class="fas fa-layer-group nav-link-icon"></i>
          <span class="nav-link-label">Áreas</span>
        </a>
      </div>
    </div>

    <!-- Información -->
    <div class="nav-section">
      <button class="section-header" (click)="toggleSection('informacion')">
        <div class="section-header-left">
          <i class="fas fa-info-circle section-icon"></i>
          <span class="section-label">Información</span>
        </div>
        <i class="fas fa-chevron-down section-arrow" [class.rotated]="!isSectionExpanded('informacion')"></i>
      </button>
      <div class="section-links" [class.collapsed]="!isSectionExpanded('informacion')">
        <a routerLink="/servicios" routerLinkActive="active" class="nav-link">
          <i class="fas fa-concierge-bell nav-link-icon"></i>
          <span class="nav-link-label">Servicios</span>
        </a>
        <a routerLink="/comunicados" routerLinkActive="active" class="nav-link">
          <i class="fas fa-bullhorn nav-link-icon"></i>
          <span class="nav-link-label">Comunicados</span>
        </a>
      </div>
    </div>

    <!-- Control de Accesos -->
    <div class="nav-section">
      <button class="section-header" (click)="toggleSection('accesos')">
        <div class="section-header-left">
          <i class="fas fa-shield-alt section-icon"></i>
          <span class="section-label">Control de Accesos</span>
        </div>
        <i class="fas fa-chevron-down section-arrow" [class.rotated]="!isSectionExpanded('accesos')"></i>
      </button>
      <div class="section-links" [class.collapsed]="!isSectionExpanded('accesos')">
        <a routerLink="/visitas" routerLinkActive="active" class="nav-link">
          <i class="fas fa-user-check nav-link-icon"></i>
          <span class="nav-link-label">Registrar Visita</span>
        </a>
        <a routerLink="/validacion" routerLinkActive="active" class="nav-link">
          <i class="fas fa-qrcode nav-link-icon"></i>
          <span class="nav-link-label">Validar QR</span>
        </a>
      </div>
    </div>

  </nav>

  <!-- Footer -->
  <div class="sidebar-footer">
    <button class="footer-btn theme-btn" (click)="toggleTheme()" [title]="isDarkMode ? 'Modo Claro' : 'Modo Oscuro'">
      <i class="fas" [ngClass]="isDarkMode ? 'fa-sun' : 'fa-moon'"></i>
      <span class="footer-btn-label">{{ isDarkMode ? 'Modo Claro' : 'Modo Oscuro' }}</span>
    </button>
    <button class="footer-btn logout-btn" (click)="logout()">
      <i class="fas fa-sign-out-alt"></i>
      <span class="footer-btn-label">Salir</span>
    </button>
  </div>

</aside>
