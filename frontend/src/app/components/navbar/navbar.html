<mat-toolbar *ngIf="showNavbar()" class="app-navbar">
  <div class="navbar-inner">
    <span class="brand-title">
      <span class="brand-icon"><i class="fas fa-building"></i></span>
      Residencial Valle del Ángel
    </span>
    
    <span class="spacer"></span>

    <nav class="nav-links">
      <button mat-button [matMenuTriggerFor]="menuMantenimiento" class="nav-btn">
        <i class="fas fa-tools"></i> <span class="nav-label">Mantenimientos</span>
      </button>
      <mat-menu #menuMantenimiento="matMenu" class="modern-menu">
        <a mat-menu-item routerLink="/casas">
          <i class="fas fa-home me-2"></i> Casas
        </a>
        <a mat-menu-item routerLink="/residentes">
          <i class="fas fa-users me-2"></i> Residentes
        </a>
        <a mat-menu-item routerLink="/areas">
          <i class="fas fa-layer-group me-2"></i> Áreas
        </a>
      </mat-menu>

      <button mat-button [matMenuTriggerFor]="menuInfo" class="nav-btn">
        <i class="fas fa-info-circle"></i> <span class="nav-label">Información</span>
      </button>
      <mat-menu #menuInfo="matMenu" class="modern-menu">
        <a mat-menu-item routerLink="/servicios">
          <i class="fas fa-concierge-bell me-2"></i> Servicios
        </a>
        <a mat-menu-item routerLink="/comunicados">
          <i class="fas fa-bullhorn me-2"></i> Comunicados
        </a>
      </mat-menu>
    </nav>

    <div class="nav-actions">
      <button class="theme-toggle-btn" (click)="toggleTheme()" [title]="isDarkMode ? 'Modo Claro' : 'Modo Oscuro'">
        <i class="fas" [ngClass]="isDarkMode ? 'fa-sun' : 'fa-moon'"></i>
      </button>

      <button class="logout-btn" (click)="logout()">
        <i class="fas fa-sign-out-alt"></i> <span class="nav-label">Salir</span>
      </button>
    </div>
  </div>
</mat-toolbar>
