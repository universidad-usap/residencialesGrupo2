<div class="main-wrapper p-4">
  <div class="container">
    
    <div class="card mb-5 shadow-sm border-0">
      <div class="card-header bg-success text-white py-3">
        <h5 class="mb-0"><i class="fas fa-edit me-2"></i>Crear Nuevo Comunicado</h5>
      </div>
      <div class="card-body p-4">
        <div class="row g-3">
          <div class="col-md-8">
            <label class="form-label">TÍTULO DEL COMUNICADO</label>
            <input type="text" [(ngModel)]="nuevoComunicado.titulo" class="form-control" placeholder="Ej: Mantenimiento de áreas verdes">
          </div>
          <div class="col-md-4">
            <label class="form-label">NIVEL DE PRIORIDAD</label>
            <select [(ngModel)]="nuevoComunicado.prioridad" class="form-select">
              <option value="informativo">🟢 Informativo</option>
              <option value="evento">🔵 Evento / Social</option>
              <option value="urgente">🔴 Urgente / Aviso Crítico</option>
            </select>
          </div>
          <div class="col-12">
            <label class="form-label">MENSAJE DETALLADO</label>
            <textarea [(ngModel)]="nuevoComunicado.mensaje" class="form-control" rows="4" placeholder="Escribe el contenido del comunicado aquí..."></textarea>
          </div>
          <div class="col-12 text-end">
            <button class="btn btn-primary px-5 fw-bold shadow-sm" (click)="publicar()">
              <i class="fas fa-paper-plane me-2"></i>Publicar Ahora
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="d-flex align-items-center mb-4">
      <hr class="flex-grow-1">
      <h5 class="px-3 text-secondary fw-bold mb-0">COMUNICADOS RECIENTES</h5>
      <hr class="flex-grow-1">
    </div>

    <div class="row g-4">
      <div class="col-md-6 col-lg-4" *ngFor="let c of comunicados">
        <div class="card h-100 border-0 shadow-sm card-comunicado" 
             [ngClass]="{
               'border-top-success': c.prioridad === 'informativo',
               'border-top-primary': c.prioridad === 'evento',
               'border-top-danger': c.prioridad === 'urgente'
             }">
          <div class="card-body d-flex flex-column">
            <div class="d-flex justify-content-between align-items-start mb-2">
              <span class="badge" 
                    [ngClass]="{
                      'bg-success': c.prioridad === 'informativo',
                      'bg-primary': c.prioridad === 'evento',
                      'bg-danger': c.prioridad === 'urgente'
                    }">
                {{ c.prioridad | uppercase }}
              </span>
              <small class="text-muted fw-bold">{{ c.fecha_publicacion | date:'dd/MM/yyyy' }}</small>
            </div>
            <h5 class="card-title fw-bold text-dark">{{ c.titulo }}</h5>
            <p class="card-text text-secondary flex-grow-1">{{ c.mensaje }}</p>
          </div>
        </div>
      </div>

      <div class="col-12 text-center py-5" *ngIf="comunicados.length === 0">
        <i class="fas fa-comment-slash fa-3x text-muted mb-3"></i>
        <p class="text-muted fs-5">No hay comunicados publicados todavía.</p>
      </div>
    </div>

  </div>
</div>
