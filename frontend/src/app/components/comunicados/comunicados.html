<div class="page-container">
  
  <!-- Form Section -->
  <div class="form-section">
    <div class="form-section-title">
      <i class="fas fa-edit"></i> Crear Nuevo Comunicado
    </div>

    <div class="row g-3">
      <div class="col-12 col-md-8">
        <label class="form-label">Título del Comunicado</label>
        <input type="text" [(ngModel)]="nuevoComunicado.titulo" class="form-control" placeholder="Ej: Mantenimiento de áreas verdes">
      </div>
      <div class="col-12 col-md-4">
        <label class="form-label">Nivel de Prioridad</label>
        <select [(ngModel)]="nuevoComunicado.prioridad" class="form-select">
          <option value="informativo">🟢 Informativo</option>
          <option value="evento">🔵 Evento / Social</option>
          <option value="urgente">🔴 Urgente / Aviso Crítico</option>
        </select>
      </div>
      <div class="col-12">
        <label class="form-label">Mensaje Detallado</label>
        <textarea [(ngModel)]="nuevoComunicado.mensaje" class="form-control" rows="4" placeholder="Escribe el contenido del comunicado aquí..."></textarea>
      </div>
      <div class="col-12 text-end">
        <button class="btn btn-primary px-4" (click)="publicar()">
          <i class="fas fa-paper-plane me-2"></i>Publicar Ahora
        </button>
      </div>
    </div>
  </div>

  <!-- Section Divider -->
  <div class="section-divider">
    <span class="section-divider-text">Comunicados Recientes</span>
  </div>

  <!-- Cards Grid -->
  <div class="row g-4">
    <div class="col-12 col-md-6 col-lg-4" *ngFor="let c of comunicados">
      <div class="comunicado-card" 
           [ngClass]="{
             'priority-success': c.prioridad === 'informativo',
             'priority-primary': c.prioridad === 'evento',
             'priority-danger': c.prioridad === 'urgente'
           }">
        <div class="comunicado-card-body">
          <div class="d-flex justify-content-between align-items-start mb-3">
            <span class="badge" 
                  [ngClass]="{
                    'badge-soft-success': c.prioridad === 'informativo',
                    'badge-soft-primary': c.prioridad === 'evento',
                    'badge-soft-danger': c.prioridad === 'urgente'
                  }">
              {{ c.prioridad | uppercase }}
            </span>
            <small class="comunicado-date">{{ c.fecha_publicacion | date:'dd/MM/yyyy' }}</small>
          </div>
          <h5 class="comunicado-title">{{ c.titulo }}</h5>
          <p class="comunicado-text">{{ c.mensaje }}</p>
        </div>
      </div>
    </div>

    <div class="col-12" *ngIf="comunicados.length === 0">
      <div class="empty-state">
        <i class="fas fa-comment-slash"></i>
        <p>No hay comunicados publicados todavía.</p>
      </div>
    </div>
  </div>

</div>
